<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bag · 包包分享 — bag.loc.cc</title>
<meta name="description" content="Bag · 包包分享站，一只一只慢慢上架。">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#faf7f2;color:#221c16;line-height:1.6}
  a{color:inherit}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 48px}
  header{padding:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  header h1{font-size:18px;margin:0;letter-spacing:.06em}
  header h1 span{font-weight:400;color:#8a7d6d;font-size:13px;margin-left:8px;letter-spacing:0}
  header .domain{font-size:12px;color:#8a7d6d;white-space:nowrap}
  .sub{font-size:13px;color:#6b5f52;margin:2px 0 16px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .toolbar input{flex:1;min-width:180px;padding:10px 12px;border:1px solid #e3d9cc;border-radius:999px;background:#fff;font-size:14px;outline:none}
  .toolbar input:focus{border-color:#221c16}
  .count{font-size:13px;color:#8a7d6d;white-space:nowrap}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .pill{border:1px solid #e3d9cc;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .pill.active{background:#221c16;color:#fff;border-color:#221c16}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:380px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid #eee3d6;border-radius:14px;overflow:hidden}
  .thumb{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#f3ede4;color:#b8a88f;font-size:44px}
  .thumb.dashed{background:#faf7f2;border-bottom:1px dashed #e3d9cc}
  .body{padding:12px}
  .body h3{margin:0 0 4px;font-size:15px}
  .body p{margin:0;font-size:13px;color:#6b5f52}
  .tag{display:inline-block;font-size:11px;background:#f3ede4;border-radius:999px;padding:2px 8px;margin-top:8px;color:#6b5f52}
  .empty{grid-column:1/-1;background:#fff;border:1px dashed #d9cbb8;border-radius:14px;padding:28px 18px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:17px}
  .empty p{margin:0;color:#6b5f52;font-size:14px}
  .how{margin-top:28px;background:#221c16;color:#f5efe6;border-radius:16px;padding:18px}
  .how h2{margin:0 0 10px;font-size:16px}
  .how ol{margin:0;padding-left:20px;font-size:14px}
  .how li{margin:6px 0}
  .how code{background:#3a322a;padding:1px 6px;border-radius:6px}
  footer{margin-top:28px;font-size:12px;color:#a08f7d;text-align:center}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bag · 包包分享<span>一只一只，慢慢分享</span></h1>
    <div class="domain">bag.loc.cc</div>
  </header>
  <p class="sub">这里是 ss 的包包分享站。没有凑数的包，只有发来一张、就上架一张的包。</p>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜包包名字、品牌…" aria-label="搜索包包">
    <span class="count" id="count">共 0 只包包</span>
  </div>

  <div class="pills" id="pills">
    <button class="pill active" data-cat="全部">全部</button>
    <button class="pill" data-cat="手提包">手提包</button>
    <button class="pill" data-cat="斜挎包">斜挎包</button>
    <button class="pill" data-cat="肩背包">肩背包</button>
    <button class="pill" data-cat="托特包">托特包</button>
    <button class="pill" data-cat="双肩包">双肩包</button>
    <button class="pill" data-cat="钱包 / 小皮具">钱包 / 小皮具</button>
  </div>

  <div class="grid" id="grid"></div>

  <section class="how">
    <h2>怎么上架一只包？</h2>
    <ol>
      <li>发一张包的照片给 Muse，也可以顺便说一句名字、品牌或一句心得。</li>
      <li>告诉我它属于哪个分类：手提 / 斜挎 / 肩背 / 托特 / 双肩 / 钱包小皮具。</li>
      <li>我帮你排版上架，bag.loc.cc 上就能点开看了。</li>
    </ol>
    <p style="font-size:13px;opacity:.85;margin:12px 0 0">以后加包不用重做整站：在页面里的 <code>BAGS</code> 列表加一条就行，搜索和分类会自动跟上。</p>
  </section>

  <footer>bag.loc.cc · Bag 包包分享 · 空架子已搭好，等第一只包来</footer>
</div>

<script>
/*
  上架数据在这里加，一只包一条。
  模板（不要删，照着填）：
  {
    name: "包包名字",
    brand: "品牌",
    cat: "手提包", // 手提包 / 斜挎包 / 肩背包 / 托特包 / 双肩包 / 钱包 / 小皮具
    note: "一句分享",
    img: "图片地址",
    link: "" // 有购买/参考链接再填，没有留空
  }
  现在是空架子：下面是空数组，不放任何假包。
*/
const BAGS = [];

let activeCat = "全部";
const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");

function render() {
  const q = (qEl.value || "").trim().toLowerCase();
  const list = BAGS.filter(b =>
    (activeCat === "全部" || b.cat === activeCat) &&
    (!q || (b.name + " " + (b.brand || "") + " " + (b.note || "")).toLowerCase().includes(q))
  );
  countEl.textContent = "共 " + list.length + " 只包包";
  grid.innerHTML = "";
  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <h2>这里还空着，等第一只包来 ✨</h2>
        <p>发一张包的照片给我，我就帮你上架在这里。<br>分类和搜索已经做好了，有包就能直接用。</p>
      </div>
      <div class="card"><div class="thumb dashed">＋</div><div class="body"><h3>待上架</h3><p>第一只包的位置留给你</p><span class="tag">发照片即可上架</span></div></div>
      <div class="card"><div class="thumb dashed">＋</div><div class="body"><h3>待上架</h3><p>第二只包的位置留给你</p><span class="tag">发照片即可上架</span></div></div>
      <div class="card"><div class="thumb dashed">＋</div><div class="body"><h3>待上架</h3><p>第三只包的位置留给你</p><span class="tag">发照片即可上架</span></div></div>`;
    return;
  }
  list.forEach(b => {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `
      <div class="thumb">${b.img ? `<img src="${b.img}" alt="${b.name}" style="width:100%;height:100%;object-fit:cover">` : "👜"}</div>
      <div class="body"><h3>${b.name}</h3><p>${b.brand ? b.brand + " · " : ""}${b.note || ""}</p><span class="tag">${b.cat}</span></div>`;
    if (b.link) {
      const a = document.createElement("a");
      a.href = b.link; a.target = "_blank"; a.rel = "noopener";
      a.appendChild(el); grid.appendChild(a);
    } else {
      grid.appendChild(el);
    }
  });
}
document.getElementById("pills").addEventListener("click", e => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  activeCat = btn.dataset.cat;
  render();
});
qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
